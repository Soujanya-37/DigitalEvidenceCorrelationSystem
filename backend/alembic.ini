; Alembic configuration file.
; sqlalchemy.url below is intentionally left as a placeholder — the real
; value is injected at runtime in alembic/env.py from app.core.config.settings
; (which reads DATABASE_URL from .env). This keeps one source of truth for
; the DB URL instead of duplicating it here.

[alembic]
script_location = alembic
prepend_sys_path = .

# Placeholder only — overridden dynamically in alembic/env.py
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# No post-write hooks configured for this project.

# --- Logging configuration ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S